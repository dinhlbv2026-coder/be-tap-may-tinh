<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#BFE6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bé Tập Máy Tính">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{box-sizing:border-box;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Bé Tập Dùng Máy Tính</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap&subset=vietnamese">
<style>
:root{
  color-scheme: light;
  --sky:#BFE6FF; --sky2:#E4F4FF; --grass:#7BC96F; --grass2:#5AAE52;
  --sun:#FFC93C; --coral:#FF6B6B; --ink:#23395B; --paper:#FFFDF7;
  --violet:#8E7DFF; --teal:#2EC4B6; --muted:#5B6F8F;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
}
html,body{height:100%}
body{background:linear-gradient(var(--sky) 0%,var(--sky2) 70%,#DFF3D8 100%);color:var(--ink);font-family:var(--body);font-size:18px;overflow-x:hidden}
.app{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px;box-sizing:border-box;max-width:1100px;margin:0 auto}
button{font-family:var(--display);cursor:pointer}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}

/* Home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-block:18px 8px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.hero h1 span{color:var(--coral)}
.hero p{margin:0;color:var(--muted);font-size:19px;max-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;padding-block:18px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 6px 0 var(--ink);transition:transform .12s, box-shadow .12s;color:var(--ink)}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--ink)}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.card .step{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .ico{font-size:58px;line-height:1.1}
.card .name{font-size:24px;font-weight:800;line-height:1.1}
.card .desc{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:600}
.card .meter{width:85%;height:12px;border-radius:99px;background:#E3ECF7;border:2px solid var(--ink);overflow:hidden;margin-top:4px}
.card .meter i{display:block;height:100%;background:var(--sun)}
.card .lv{font-size:15px;font-weight:700;color:var(--ink)}
.tip{background:var(--paper);border-radius:18px;padding:12px 16px;font-size:16px;color:var(--muted);border:2px dashed #9FB8D6;margin-bottom:12px}
.tip b{color:var(--ink)}

/* Game screen */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 10px}
.btn{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;font-size:19px;font-weight:700;padding:6px 14px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--sun)}
.say{flex:1;min-width:200px;font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,27px);line-height:1.2}
.prog{display:flex;gap:4px;flex-wrap:wrap}
.prog i{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:block;box-sizing:border-box}
.prog i.on{background:var(--sun)}
.stage{position:relative;flex:1;min-height:420px;background:linear-gradient(#DDF2FF 0%,#F3FBFF 72%,var(--grass) 72%,var(--grass2) 100%);border:4px solid var(--ink);border-radius:28px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.plain{background:var(--paper)}

.obj{position:absolute;will-change:transform;display:flex;align-items:center;justify-content:center;line-height:1;transform:translate(-50%,-50%)}
.star{font-size:78px;animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(35,57,91,.25))}
.ring{position:absolute;border-radius:50%;border:5px dashed var(--coral);transform:translate(-50%,-50%);animation:spin 6s linear infinite;pointer-events:none}
.pop{animation:pop .45s ease-out forwards;pointer-events:none}
.balloon{cursor:pointer;transform:translate(-50%,0);filter:drop-shadow(0 6px 0 rgba(35,57,91,.18));transform-origin:50% 0}
.balloon svg{display:block}
.bubbleo{cursor:pointer;border-radius:50%;
  background:
    radial-gradient(circle at 30% 26%,rgba(255,255,255,.98) 0 7%,rgba(255,255,255,0) 13%),
    radial-gradient(circle at 70% 76%,rgba(255,255,255,.7) 0 4%,rgba(255,255,255,0) 8%),
    radial-gradient(circle,rgba(255,255,255,0) 52%,rgba(150,225,255,.45) 68%,rgba(255,170,235,.55) 82%,rgba(255,255,255,.95) 100%),
    conic-gradient(from 40deg,rgba(158,231,255,.35),rgba(255,179,240,.35),rgba(182,255,207,.35),rgba(255,230,150,.3),rgba(158,231,255,.35));
  box-shadow:inset 0 0 0 1.5px rgba(120,200,255,.6);
  animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{scale:1.06 .95}}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.fruit{font-size:72px;cursor:grab;transform:none;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.7);border:3px solid transparent;touch-action:none}
.fruit.drag{cursor:grabbing;border-color:var(--violet);z-index:5;scale:1.12}
.fruit.done{opacity:0;transition:opacity .3s}
.basket{position:absolute;background:#D98E4A;border:5px solid #8A5220;box-sizing:border-box;border-radius:18px 18px 70px 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;text-align:center;box-shadow:inset 0 -12px 0 #B8702F}
.basket .in{font-size:40px;min-height:44px;letter-spacing:-6px}
.basket.hot{outline:6px solid var(--sun)}

@keyframes bob{50%{translate:0 -10px}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pop{0%{scale:1;opacity:1}60%{scale:1.7;opacity:.8}100%{scale:2.2;opacity:0}}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}
.shake{animation:shake .35s}

/* Typing */
.typebox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 12px 12px}
.bigkey{font-family:var(--display);font-weight:800;font-size:clamp(110px,22vw,190px);line-height:1;width:1.3em;height:1.2em;display:flex;align-items:center;justify-content:center;background:#fff;border:6px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);color:var(--coral)}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:720px}
.kb .row{display:flex;gap:5px;justify-content:center;width:100%}
.kb button{flex:1;max-width:58px;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:clamp(14px,3vw,22px);font-weight:800;color:var(--ink);padding:0;box-shadow:0 3px 0 var(--ink)}
.kb button.hint{background:var(--sun);animation:bob 1s infinite}
.kb button.space{max-width:300px;aspect-ratio:auto;height:44px;flex:6}
.kb button.dead{opacity:.35}

/* Arrows */
.grid{position:absolute;inset:66px 14px 118px;display:grid;gap:6px}
.cell{min-height:0;overflow:hidden;background:#EAF7E4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4vw,44px)}
.cell.path{background:#FFF1C2}
.pad{position:absolute;bottom:10px;left:50%;translate:-50% 0;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px}
.pad button{border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.pad button.lit{background:var(--sun)}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}

/* Win */
.win{position:absolute;inset:0;background:rgba(35,57,91,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.winbox{background:var(--paper);border:5px solid var(--ink);border-radius:30px;padding:24px 28px;text-align:center;box-shadow:0 10px 0 var(--ink);max-width:420px}
.winbox h2{font-family:var(--display);font-size:44px;margin:0;color:var(--coral);line-height:1.1}
.winbox .st{font-size:50px;margin:6px 0}
.winbox p{margin:0 0 16px;color:var(--muted);font-size:18px}
.winbox .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hand{position:absolute;font-size:44px;pointer-events:none;z-index:4;transition:left .8s ease, top .8s ease;opacity:.9}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.basket.fruit{background:#E8605A;border-color:#9E2A25;box-shadow:inset 0 -12px 0 #C4443F}
.basket.veg{background:#4FB45F;border-color:#23703A;box-shadow:inset 0 -12px 0 #3A9449}
.basket .lb{font-size:clamp(15px,2.4vw,22px);line-height:1.1;padding:0 6px}
.basket .in{font-size:clamp(22px,3.5vw,36px);min-height:30px;letter-spacing:-4px;max-width:92%;overflow:hidden;white-space:nowrap}

/* Levels */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding-block:8px 14px}
.lvl{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--ink);color:var(--ink);text-align:center;min-height:132px;justify-content:space-between}
.lvl:hover{transform:translateY(-3px)}
.lvl .n{font-size:40px;font-weight:800;line-height:1}
.lvl .d{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);line-height:1.25;text-wrap:balance}
.lvl .s{font-size:20px;color:var(--sun);-webkit-text-stroke:1px #C9941A;letter-spacing:1px}

.lvl.locked{opacity:.5;cursor:not-allowed;box-shadow:0 5px 0 #8494AE;border-color:#8494AE}
.lvl.locked:hover{transform:none}
.parent{display:flex;justify-content:center;padding-block:4px 12px}
.link{background:none;border:none;color:var(--muted);font-family:var(--body);font-size:15px;font-weight:700;text-decoration:underline;padding:6px}
.acc{background:#3DBE5B;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;border-radius:14px;padding:5px 12px;font-variant-numeric:tabular-nums}
.acc.low{background:#FF9F43;color:var(--ink)}
.winbox.fail h2{color:#E07A1F}
.meter2{position:relative;height:22px;border:3px solid var(--ink);border-radius:99px;background:#E3ECF7;overflow:hidden;margin:12px 0}
.meter2 i{display:block;height:100%;background:#FF9F43}
.meter2 b{position:absolute;left:90%;top:-2px;bottom:-2px;width:4px;background:var(--ink)}
.lvl .st{font-family:var(--body);font-size:13px;font-weight:800;border-radius:99px;padding:2px 10px}
.lvl .st.ok{background:#3DBE5B;color:#fff}
.lvl .st.try{background:#FFE2C7;color:#8A4A10}
.lvl .st.new{background:#E3ECF7;color:var(--muted)}
.lvl .st.lock{background:transparent;color:var(--muted)}
.lvl.done{background:#E6F7E4;border-color:#1E8A3A;box-shadow:0 5px 0 #1E8A3A}
.lvl.done .n{color:#1E8A3A}
.card.complete{background:#E6F7E4}
.stamp{display:inline-block;margin:4px 0 10px;padding:4px 14px;border:3px solid #1E8A3A;color:#1E8A3A;border-radius:10px;font-family:var(--display);font-weight:800;font-size:20px;rotate:-3deg}
.btn.danger{background:var(--coral);color:#fff}
.win.fixed{position:fixed;z-index:50}
.parent{gap:14px;flex-wrap:wrap}
.boom{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
.vol{display:flex;align-items:center;gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:2px 4px;box-shadow:0 4px 0 var(--ink)}
.vol button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:22px;font-weight:800;color:var(--ink);padding:0;line-height:1}
.vol .mus{width:auto!important;padding:0 8px!important;font-size:15px!important}
.vol .mus.off{opacity:.45;background:#E3ECF7}
.vol .vl{font-family:var(--display);font-weight:800;font-size:17px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.lvl .th{font-size:14px;font-weight:800;color:var(--ink)}
.bemo{position:absolute;left:50%;top:50%;translate:-50% -50%;pointer-events:none;line-height:1}
.bemo.onb{translate:-50% 0;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
.basket.home{background:#D98E4A;border-color:#8A5220;box-shadow:inset 0 -12px 0 #B8702F}
.reveal{position:absolute;inset:0;z-index:18;display:flex;align-items:center;justify-content:center;background:rgba(35,57,91,.35);transition:opacity .3s}
.reveal.out{opacity:0}
.rcard{background:var(--paper);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:18px 34px;text-align:center;animation:inBounce .45s ease-out}
.ric{font-size:110px;line-height:1.1}
.ric.land{animation:inSpin .5s ease-out}
.rnm{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,34px);color:var(--ink)}
@keyframes inPop{0%{scale:0}70%{scale:1.2}100%{scale:1}}
@keyframes inSpin{0%{scale:0;rotate:-360deg}100%{scale:1;rotate:0deg}}
@keyframes inBounce{0%{scale:1 0}45%{scale:1.25 .75}70%{scale:.9 1.12}100%{scale:1 1}}
@keyframes inZoom{0%{scale:2.6;opacity:0}100%{scale:1;opacity:1}}
@keyframes inWobble{0%{scale:.3;rotate:-30deg}40%{scale:1.1;rotate:18deg}70%{rotate:-8deg}100%{scale:1;rotate:0deg}}
@keyframes inDrop{0%{translate:0 -160px;opacity:0}60%{translate:0 12px;opacity:1}80%{translate:0 -6px}100%{translate:0 0}}
.in-pop{animation:inPop .4s ease-out}.in-spin{animation:inSpin .5s ease-out}.in-bounce{animation:inBounce .5s ease-out}
.in-zoom{animation:inZoom .4s ease-out}.in-wobble{animation:inWobble .6s ease-out}.in-drop{animation:inDrop .55s ease-out}
.star.in-pop{animation:inPop .4s ease-out,bob 1.2s ease-in-out .4s infinite}
.star.in-spin{animation:inSpin .5s ease-out,bob 1.2s ease-in-out .5s infinite}
.star.in-bounce{animation:inBounce .5s ease-out,bob 1.2s ease-in-out .5s infinite}
.star.in-zoom{animation:inZoom .4s ease-out,bob 1.2s ease-in-out .4s infinite}
.star.in-wobble{animation:inWobble .6s ease-out,bob 1.2s ease-in-out .6s infinite}
.star.in-drop{animation:inDrop .55s ease-out,bob 1.2s ease-in-out .55s infinite}
.lucky{filter:drop-shadow(0 0 6px #FFD700) drop-shadow(0 0 14px #FF7FC8) drop-shadow(0 0 22px #7FD8FF)!important}
.star.lucky::after,.fruit.lucky::after{content:'✨';position:absolute;right:-14%;top:-14%;font-size:40%;animation:bob .8s infinite}
.star.pop,.fruit.pop{animation:pop .45s ease-out forwards}
.star.fade,.fruit.fade{animation:fadeout .3s forwards}
.stage.err{animation:errflash .3s}
@keyframes errflash{50%{box-shadow:inset 0 0 0 6px #FF6B3D}}
.tbar.bal{position:absolute;left:15%;width:70%;height:10px;min-width:40px}
.emo{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;pointer-events:none;user-select:none;-webkit-user-drag:none;object-fit:contain}
.star .emo,.fruit .emo,.cell .emo,.ric .emo{vertical-align:middle;filter:drop-shadow(0 4px 3px rgba(35,57,91,.25))}
.basket .in .emo{margin-left:-6px}
.cell .emo{width:auto;height:78%;aspect-ratio:1}
.players{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding-block:18px}
.player{background:var(--paper);border:5px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:18px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:200px;color:var(--ink)}
.player:hover{transform:translateY(-4px)}
.pav{font-size:110px;line-height:1}
.pname{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.pleft{font-family:var(--body);font-weight:800;font-size:16px;background:#E6F7E4;color:#1E8A3A;border-radius:99px;padding:3px 12px}
.pleft.out{background:#FFE2C7;color:#8A4A10}
.clock{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:17px;border-radius:99px;padding:6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums;pointer-events:none}
.clock.low{background:#E0561F;animation:bob 1s infinite}
.timewarn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;z-index:55;background:#FFC93C;color:var(--ink);border:4px solid var(--ink);border-radius:20px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,26px);box-shadow:0 6px 0 var(--ink);animation:toastin .3s ease-out;max-width:calc(100% - 32px);text-align:center}
.lockbox{margin:40px auto;max-width:560px;background:var(--paper);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.lockbox h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);margin:0;color:#E0561F;line-height:1.15;text-wrap:balance}
.lockbox p{margin:0;color:var(--muted);font-size:18px}
.lk-ico{font-size:96px;line-height:1}
.pin{font-family:var(--display);font-size:28px;width:140px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px}
.pmsg{color:#C4441F!important;min-height:22px;margin:6px 0!important}
.wrongpill{background:#FFE1D6;color:#B23A12;font-family:var(--display);font-weight:800;font-size:16px;border-radius:12px;padding:4px 10px;white-space:nowrap;border:2px solid #F2A487}
.wrongpill.bump{animation:inPop .3s}
.nope{animation:nope .42s forwards!important;pointer-events:none}
@keyframes nope{0%{filter:grayscale(0)}20%{translate:-8px 0}40%{translate:8px 0;filter:grayscale(1)}60%{translate:-6px 0}100%{translate:0 20px;opacity:0;filter:grayscale(1)}}
.autobar{height:8px;border-radius:99px;background:#E3ECF7;overflow:hidden;margin-top:12px;border:2px solid var(--ink)}
.autobar i{display:block;height:100%;background:var(--sun)}
.autonote{font-size:14px;color:var(--muted);margin-top:4px}
.pwrap{position:relative}
.pdel{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;font-weight:800;padding:0;box-shadow:0 3px 0 var(--ink)}
.player.addp{border-style:dashed;background:#F4FAFF}
.player.addp .pav{font-size:70px;color:var(--muted)}
.player.addp .pleft{background:#E3ECF7;color:var(--muted)}
.pin.name{width:min(260px,100%);font-size:24px;text-transform:none}
.mboard{position:absolute;inset:40px 10px 10px;display:grid;justify-content:center;align-content:center}
.memstage .tbar.top{top:14px}
.mcard{font:inherit;line-height:1;padding:0;border:0;background:none;perspective:600px;cursor:pointer;width:100%;height:100%;touch-action:manipulation}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .26s cubic-bezier(.3,.7,.4,1);transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .fc{position:absolute;inset:0;border-radius:14%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}

   5 bậc âm lượng. Âm thao tác chạy ở bậc đang chọn; âm khen (lời khen + nhạc khen) thấp hơn 2 bậc. */
const VOL_GAIN=[0,0.15,0.3,0.5,0.75,1];
let volLevel=5;
try{ const v=localStorage.getItem('btmt-vol'); if(v!==null && +v>=0 && +v<=5) volLevel=+v; }catch(e){}
function gainOf(cat){ if(!volLevel) return 0; return (cat==='praise'||cat==='music') ? VOL_GAIN[Math.max(volLevel-2,1)] : VOL_GAIN[volLevel]; }  // khen & nhạc nền: thấp hơn 2 bậc
let ac=null; const bus={}; let NB=null;
function actx(){
  if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; try{ ac=new AC({latencyHint:'interactive'}); }catch(e){ ac=new AC(); } }
  if(ac.state!=='running') ac.resume().catch(()=>{});
  return ac;
}
/* Mở khóa âm thanh ngay lần chạm/bấm phím đầu tiên: tạo sẵn bộ tạo âm, kênh và bộ đệm tiếng ồn
   để các âm sau phát tức thì, không phải khởi tạo giữa lúc chơi. */
function unlockAudio(){
  try{
    const a=actx();
    const b=a.createBuffer(1,1,a.sampleRate), s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0);
    out('act'); out('praise'); out('music'); noiseBuf(a);
    if(a.state==='running') Music.kick(); else a.resume().then(()=>Music.kick()).catch(()=>{});
  }catch(e){}
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

function noiseBuf(a){
  if(!NB){ NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  return NB;
}
const LEAD=0.004; // đệm 4 ms để lịch phát không bị trễ nhịp
function out(cat){
  const a=actx();
  if(!bus[cat]){ const g=a.createGain(); const comp=a.createDynamicsCompressor(); g.connect(comp); comp.connect(a.destination); bus[cat]=g; }
  bus[cat].gain.value=gainOf(cat); return bus[cat];
}
function tone(freq, dur=0.12, type='sine', when=0, vol=0.18, cat='act', slideTo){
  if(!gainOf(cat)) return;
  try{
    const a=actx(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime+LEAD+when;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(out(cat)); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur=.09, freq=1800, vol=.5, o={}){
  const cat=o.cat||'act'; if(!gainOf(cat)) return;
  try{
    const a=actx(), t=a.currentTime+LEAD+(o.when||0);
    const src=a.createBufferSource(); src.buffer=noiseBuf(a);
    const f=a.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.value=freq; f.Q.value=o.q||.7;
    const g=a.createGain();
    g.gain.setValueAtTime(vol,t);
    if((o.curve||4)<=1.5) g.gain.linearRampToValueAtTime(0.0001,t+dur); else g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
    src.connect(f); f.connect(g); g.connect(out(cat));
    src.start(t, Math.random()*1.4, dur+0.03);
  }catch(e){}
}

let speakTimer=null;
function speak(text, force, cat='act'){
  const vol=gainOf(cat); if(!vol) return;
  try{
    const busy=speechSynthesis.speaking||speechSynthesis.pending;
    if(busy && !force) return;
    clearTimeout(speakTimer);
    const go=()=>{ const u=new SpeechSynthesisUtterance(text); u.lang='vi-VN'; u.rate=1; u.pitch=1.15; u.volume=vol; if(viVoice) u.voice=viVoice; speechSynthesis.speak(u); };
    if(busy){ speechSynthesis.cancel(); speakTimer=setTimeout(go,60); }  // Chrome bỏ qua lời nói nếu gọi ngay sau cancel
    else go();
  }catch(e){}
}

        c.globalAlpha=1-kk; c.fillStyle='#FFD23F'; c.beginPath(); c.arc(p.x,p.y,p.s*(1.6+kk*1.5),0,7); c.fill(); c.globalAlpha=1; continue; }
      if(k>=1){P.splice(i,1);continue}
      if(p.k==='flash'){ const rr=80*S*(0.5+k); const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,rr); g.addColorStop(0,'rgba(255,255,255,.8)'); g.addColorStop(1,'rgba(255,255,255,0)'); c.globalAlpha=1-k; c.fillStyle=g; c.beginPath(); c.arc(p.x,p.y,rr,0,7); c.fill(); c.globalAlpha=1; continue; }
      p.px=p.x; p.py=p.y; p.vx*=Math.pow(p.drag,dt); p.vy=p.vy*Math.pow(p.drag,dt)+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.k==='s'){ c.globalAlpha=Math.max(0,1-k*k); c.strokeStyle=p.col; c.lineWidth=4; c.lineCap='round'; c.beginPath(); c.moveTo(p.px-(p.vx*2.2),p.py-(p.vy*2.2)); c.lineTo(p.x,p.y); c.stroke();
        if(Math.random()<.3){ c.fillStyle='#FFE36E'; c.beginPath(); c.arc(p.x,p.y,2.5,0,7); c.fill(); } }
      else { // kim tuyến: lật lấp lánh
        p.vx+=Math.sin(p.age*.15+p.ph)*.05; p.rot+=p.vr*dt;
        const flip=Math.cos(p.age*.35+p.ph); c.globalAlpha=Math.min(1,(1-k)*1.6);

        c.fillStyle=p.col; c.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        if(flip>.8){ c.fillStyle='rgba(255,255,255,.9)'; c.fillRect(-p.w/2,-p.h/2,p.w,p.h*.35); }
        c.setTransform(dpr,0,0,dpr,0,0); }

    if((P.length||R.length) && t-t0<5000) requestAnimationFrame(loop); else cv.remove();
  }

}

let cleanup=[];
function on(t,ev,fn,opt){ t.addEventListener(ev,fn,opt); cleanup.push(()=>t.removeEventListener(ev,fn,opt)); }
function every(fn,ms){ const id=setInterval(fn,ms); cleanup.push(()=>clearInterval(id)); }

  Math.random=()=>{ if(i>=512){ c.getRandomValues(buf); i=0; } return buf[i++]/4294967296; }; }catch(e){} })();

/* "Túi bốc thăm": lấy hết một lượt mới trộn lại → không lặp lại liền nhau, mọi hình đều được ra */
function bag(arr){ let pool=[], last; return ()=>{ if(!pool.length){ pool=shuffle(arr); if(pool.length>1 && pool[0]===last) pool.push(pool.shift()); } return last=pool.shift(); }; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function countdown(sec, bar, onEnd){
  const start=performance.now(); let raf, alive=true; const fill=bar.firstChild;
  let warned=false;
  const f=t=>{ if(!alive) return; const k=(t-start)/1000/sec;
    fill.style.width=Math.max(0,100*(1-k))+'%'; bar.classList.toggle('warn',k>0.7);
    if(k>0.7 && !warned){ warned=true; sWarn(); }
    if(k>=1){ alive=false; onEnd(); return; } raf=requestAnimationFrame(f); };

  const stop=()=>{ alive=false; cancelAnimationFrame(raf); };
  cleanup.push(stop); return stop;
}

/* ---------- FX: hệ hạt trên canvas ---------- */
function createFX(stage){
  const cv=el('canvas','fx'); stage.append(cv);
  const ctx=cv.getContext('2d'); let W=0,H=0,dpr=1;
  function size(){ const r=stage.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size();
  let ro; try{ ro=new ResizeObserver(size); ro.observe(stage); cleanup.push(()=>ro.disconnect()); }catch(e){}
  const P=[]; let raf, last=performance.now(), dirty=false;
  function loop(t){
    const dt=Math.min(40,t-last)/16.67; last=t;
    if(!P.length){ if(dirty){ ctx.clearRect(0,0,W,H); dirty=false; } raf=requestAnimationFrame(loop); return; }
    dirty=true; ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){
      const p=P[i]; p.age+=dt; const k=p.age/p.life;
      if(k>=1){P.splice(i,1);continue}
      p.vx*=Math.pow(p.drag||1,dt); p.vy=p.vy*Math.pow(p.drag||1,dt)+(p.g||0)*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=(p.vr||0)*dt;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-Math.pow(k,p.fadePow||1.6)); ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
      DRAW[p.type](ctx,p,k);
      ctx.restore();
    }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop); cleanup.push(()=>cancelAnimationFrame(raf));
  const lagMs=()=>avLag()*1000;
  return { add:(o)=>{ const p=Object.assign({age:0,rot:0,vx:0,vy:0},o), d=lagMs(); if(d<15) P.push(p); else setTimeout(()=>P.push(p),d); }, get H(){return H} };
}
const DRAW={
  shard(c,p){ c.strokeStyle=p.color; c.lineWidth=p.w; c.lineCap='round';
    c.beginPath(); c.moveTo(-p.s,0); c.quadraticCurveTo(0,-p.s*0.9,p.s,0); c.stroke();
    c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=p.w*0.3; c.beginPath(); c.moveTo(-p.s*0.5,-p.s*0.35); c.quadraticCurveTo(0,-p.s*0.7,p.s*0.4,-p.s*0.35); c.stroke(); },
  confetti(c,p){ c.fillStyle=p.color; const f=Math.cos(p.age*0.25+p.ph); c.scale(1,Math.abs(f)+0.15); c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); },
  flash(c,p,k){ const r=p.r*(0.4+k*1.3); const g=c.createRadialGradient(0,0,0,0,0,r);
    g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(0.5,p.color+'99'); g.addColorStop(1,p.color+'00');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,7); c.fill(); },
  ring(c,p,k){ const r=p.r*(1+k*(p.grow||0.8)); c.lineWidth=p.w*(1-k)+0.5;
    c.strokeStyle=p.color||'#B9A8FF'; c.beginPath(); c.arc(0,0,r,0,7); c.stroke(); },
  drop(c,p){ const sp=Math.hypot(p.vx,p.vy), a=Math.atan2(p.vy,p.vx); c.rotate(a-(p.rot||0));
    const L=p.s*(1+Math.min(1.6,sp*0.12));

    c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.arc(p.s*0.3,-p.s*0.3,p.s*0.28,0,7); c.fill(); },
  bubble(c,p){ const wob=Math.sin(p.age*0.2+p.ph)*0.08; c.scale(1+wob,1-wob);

  string(c,p){ c.strokeStyle='#6B7A90'; c.lineWidth=1.8; c.beginPath(); c.moveTo(0,0);
    for(let i=1;i<=6;i++) c.lineTo(Math.sin(p.age*0.3+i)*5*(i/6), i*p.s/6); c.stroke(); }
};

const remaining=()=>LIMIT+usage.extra-usage.sec;
const fmt=s=>{ s=Math.max(0,s); const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; };
const clockEl=el('div','clock'); clockEl.hidden=true; document.body.append(clockEl);
function updateClock(){
  const pills=document.querySelectorAll('.clockpill');
  if(!USER){ clockEl.hidden=true; pills.forEach(p=>p.hidden=true); return; }
  const r=remaining(), html=`${ico(USER.avatar)} <span class="lbl">${USER.name} · </span>⏳ ${fmt(r)}`;
  pills.forEach(p=>{ p.hidden=false; if(p.innerHTML!==html) p.innerHTML=html; p.classList.toggle('low', r<=300); });
  clockEl.hidden = pills.length>0;
  if(!clockEl.hidden){ clockEl.innerHTML=`${ico(USER.avatar)} ${USER.name} · ⏳ còn ${fmt(r)}`; clockEl.classList.toggle('low', r<=300); }
}
function timeWarn(min){
  sTime(); setTimeout(sWarn,450);
  const msg=`${NAME} ơi, còn ${min} phút chơi hôm nay nhé!`;
  speak(msg,true);
  const b=el('div','timewarn',`⏰ ${msg}`); document.body.append(b); setTimeout(()=>b.remove(),4200);
}
setInterval(()=>{
  if(!USER || locked || document.hidden) return;
  if(usage.date!==today()){ usage={date:today(),sec:0,extra:0,w5:false,w1:false}; }
  usage.sec++; usageTick++;
  const r=remaining();
  if(r<=300 && r>60 && !usage.w5){ usage.w5=true; timeWarn(5); }
  if(r<=60 && r>0 && !usage.w1){ usage.w1=true; timeWarn(1); }
  updateClock();
  if(usageTick%5===0) saveUsage(usageTick%20===0);
  if(r<=0){ saveUsage(true); lockOut(); }
},1000);
function lockOut(){
  app.classList.remove('playing');
  locked=true; stopAll(); Music.stop(); try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll('.boom').forEach(c=>c.remove());
  app.innerHTML='';
  const box=el('div','lockbox');
  box.innerHTML=`<div class="lk-ico">${ico('⏰')}</div><h1>Hết giờ chơi hôm nay rồi, ${NAME} ơi!</h1>
    <p>${NAME} đã chơi đủ 45 phút. Mình nghỉ cho mắt, đứng dậy vận động một chút nhé. Hẹn ${NAME} ngày mai!</p>`;
  const acts=el('div','acts');
  const sw=el('button','btn go','👤 Đổi người chơi'); sw.onclick=login;
  acts.append(sw); box.append(acts);
  const pr=el('div','parent');
  const add=el('button','link','Phụ huynh: cho thêm 15 phút');
  add.onclick=()=>parentGate(()=>{ usage.extra+=900; usage.w5=false; usage.w1=false; saveUsage(true); locked=false; home(); });
  pr.append(add); box.append(pr);
  app.append(box);
  setTimeout(()=>{ sFail(); speak(`Hết giờ chơi hôm nay rồi, ${NAME} ơi. Hẹn ${NAME} ngày mai nhé!`,true); },200);
  redraw=()=>{};
}
/* Cổng phụ huynh: một phép nhân mà bé lớp 1 chưa làm được */
function parentGate(onOk){
  const a=6+Math.floor(Math.random()*4), b=6+Math.floor(Math.random()*4);
  const w=el('div','win fixed'), box=el('div','winbox');
  box.innerHTML=`<h2 style="font-size:28px;color:var(--ink)">Dành cho phụ huynh</h2><p>${a} × ${b} = ?</p>`;
  const inp=el('input','pin'); inp.id='parent-answer'; inp.type='number'; inp.inputMode='numeric'; inp.setAttribute('aria-label','Kết quả phép nhân');
  const msg=el('p','pmsg','');
  const acts=el('div','acts');
  const no=el('button','btn','Thôi'); no.onclick=()=>w.remove();
  const ok=el('button','btn go','Xác nhận');
  const check=()=>{ if(+inp.value===a*b){ w.remove(); onOk(); } else { msg.textContent='Chưa đúng, thử lại nhé.'; inp.value=''; inp.focus(); } };
  ok.onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
  acts.append(no,ok); box.append(inp,msg,acts); w.append(box); document.body.append(w); inp.focus();
}

/* ================= Chọn cấp ================= */
function levels(gi){
  stopAll(); app.classList.remove('playing');
  Music.play('home');
  const g=GAMES[gi];
  app.innerHTML='';
  const bar=el('div','bar');
  const back=el('button','btn','← Về nhà'); back.onclick=home;
  bar.append(back, el('div','say',`${ico(g.ico)} ${g.name}: chọn cấp độ`), el('div','clockpill'));
  app.append(bar); updateClock();
  const grid=el('div','levels');
  g.levels.forEach((d,k)=>{
    const L=k+1, open=isOpen(g.id,L), s=starsOf(g.id,L);
    const bp=bestOf(g.id,L);
    const b=el('button','lvl'+(open?'':' locked')+(s?' done':''));
    const state = s ? `<span class="st ok">✓ Hoàn thành</span>`
                : !open ? `<span class="st lock">Qua cấp ${L-1} để mở</span>`
                : bp ? `<span class="st try">Chưa đạt · ${bp}%</span>`
                : `<span class="st new">Chưa chơi</span>`;
    b.innerHTML=`<span class="n">${s?'✓ ':''}${open?L:'🔒'}</span><span class="th">🎲 Chủ đề bất ngờ</span><span class="d">${d}</span><span class="t">⏱ ${g.time(L)}</span>${state}<span class="s">${starStr(s)}</span>`;
    b.setAttribute('aria-label',`Cấp ${L}: ${d}, ${g.time(L)}, ${s?'đã hoàn thành':open?'đang mở':'chưa mở'}`);
    if(open) b.onclick=()=>play(gi,L);
    else b.onclick=()=>{ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sBad(); };
    grid.append(b);
  });
  app.append(grid);
  const pr=el('div','parent');
  const u=el('button','link', prog.unlockAll?'Phụ huynh: khóa lại các cấp chưa qua':'Phụ huynh: mở tất cả các cấp');
  u.onclick=()=>{ prog.unlockAll=!prog.unlockAll; save(); levels(gi); };
  const rg=el('button','link','Làm lại môn này từ cấp 1');
  rg.onclick=()=>confirmBox(`Làm lại môn ${g.name}?`,`Sao và cấp đã hoàn thành của môn ${g.name} sẽ bị xóa. Các môn khác giữ nguyên.`,'Xóa môn này',()=>{ resetGame(g.id); levels(gi); });
  pr.append(u,rg); app.append(pr);
  redraw=()=>levels(gi);
}

/* ================= Khung chơi =================
   Một "lượt" = một mục tiêu (ngôi sao, quả bóng đúng, một món, một chữ/từ, một vòng đi).
   good()    : đạt lượt
   timeout(n): hết giờ, vật tự mất → không đạt lượt (n = số thao tác bị mất)
   bad()     : thao tác sai, lượt vẫn tiếp tục
   hit()     : một thao tác đúng bên trong lượt (chữ cái trong từ, bước đi)
   Tỉ lệ đúng = thao tác đúng / (đúng + sai + bị mất do hết giờ); cần ≥ 90% để qua cấp. */
function play(gi,L){
  if(locked||remaining()<=0) return lockOut();
  stopAll();
  const g=GAMES[gi];
  CUR_THEME=pickTheme();
  Music.play(THEME_MUSIC[CUR_THEME.name]||'home');
  const cfg=CFG[g.id](L);
  cfg.gap=GAP(L);
  app.innerHTML=''; app.classList.add('playing');
  const bar=el('div','pbar');
  const back=el('button','btn','<span class="i">←</span><span class="lbl"> Chọn cấp</span>'); back.setAttribute('aria-label','Chọn cấp'); back.onclick=()=>levels(gi);
  const badge=el('div','badge',`Cấp ${L}/10 · ${ico(TH(L).icon)} ${TH(L).name}<span class="lbl"> · ⏱ ${g.time(L)}</span>`);
  const say=el('div','say',cfg.say);
  const snd=el('button','btn','<span class="i">🗣</span><span class="lbl"> Nghe</span>'); snd.title='Nghe hướng dẫn'; snd.setAttribute('aria-label','Nghe hướng dẫn'); snd.onclick=()=>{ if(!volLevel){ volLevel=3; } speak(say.textContent,true); };
  const mute=volWidget();
  const dots=el('div','prog');
  for(let k=0;k<cfg.need;k++) dots.append(el('i'));
  if(cfg.need>20) dots.classList.add('many');
  const acc=el('div','acc','Đạt 100%');
  const wrongEl=el('div','wrongpill','❌ Sai 0');
  const rst=el('button','btn','<span class="i">↺</span><span class="lbl"> Chơi lại</span>'); rst.setAttribute('aria-label','Chơi lại cấp này'); rst.onclick=()=>play(gi,L);
  const cp=el('div','clockpill');
  const r1=el('div','prow'), tools=el('div','tools'), r2=el('div','prow sub');
  tools.append(snd,rst,mute);
  r1.append(back,badge,acc,wrongEl,cp,tools);
  r2.append(say,dots);
  bar.append(r1,r2);
  redraw=()=>{};
  const stage=el('div','stage');
  const toast=el('div','toast'); toast.hidden=true;
  app.append(bar,stage);
  updateClock();
  /* Cách tính: chỉ tính theo LƯỢT.
     - Làm xong trong thời gian (dù có bấm sai vài lần) → ĐẠT lượt.
     - Hết giờ mà chưa xong → KHÔNG ĐẠT lượt.
     - Bấm sai chỉ phát âm cảnh báo, không nói, không trừ điểm. */
  let turns=0, score=0, wrongs=0, ended=false, lastBadSpeak=0, tt;
  const rate=()=> turns ? score/turns : 1;
  function showAcc(){ const r=rate(); acc.textContent=`Đạt ${Math.floor(r*100)}%`; acc.classList.toggle('low', r<PASS); }
  function showToast(text,kind){
    toast.textContent=text; toast.className='toast '+kind; toast.hidden=false;
    stage.append(toast);
    clearTimeout(tt); tt=setTimeout(()=>toast.hidden=true,1300);
  }
  function scold(prefix){
    /* không nói, không hiện chữ */
  }
  function endTurn(){ turns++; if(turns>=cfg.need){ ended=true; later(finish,600); } }
  const api={
    stage, L, cfg,
    hit(){},
    good(){ if(ended) return; score++; dots.children[turns]?.classList.add('on'); endTurn(); showAcc(); },
    timeout(){ if(ended) return; dots.children[turns]?.classList.add('off'); sTime(); endTurn(); showAcc(); },
    bad(kind){                                   // kind==='miss': bấm vào chỗ trống → chỉ cảnh báo, không tính
      if(ended) return; sErr(); stage.classList.remove('err'); void stage.offsetWidth; stage.classList.add('err');
      if(kind==='miss') return;
      wrongs++; wrongEl.textContent=`❌ Sai ${wrongs}`; wrongEl.classList.remove('bump'); void wrongEl.offsetWidth; wrongEl.classList.add('bump'); },
    get score(){return score}, get turns(){return turns}, get ended(){return ended}
  };
  function finish(){
    stopAll(); clearTimeout(tt); toast.hidden=true;
    Music.stop();
    const r=rate(), pct=Math.floor(r*100), pass=r>=PASS;
    const w=el('div','win'), box=el('div','winbox'+(pass?'':' fail'));
    const acts=el('div','acts');
    const again=el('button','btn'+(pass?'':' go'),'Chơi lại'); again.onclick=()=>play(gi,L);
    const list=el('button','btn','Chọn cấp'); list.onclick=()=>levels(gi);
    acts.append(again,list);
    const lost=cfg.need-score;
    const detail=`Đạt ${score}/${cfg.need} lượt = ${pct}%${lost?` (hết giờ ${lost} lượt)`:''}${wrongs?` · chọn sai ${wrongs} lần`:' · không chọn sai lần nào'}`;
    if(pass){
      const w3=cfg.w3??2, w2=cfg.w2??5;
      const stars = (r>=1 && wrongs<=w3)?3 : (r>=0.95 && wrongs<=w2)?2 : 1;   // qua cấp theo lượt; số lần sai quyết định số sao
      prog[g.id]=prog[g.id]||{}; prog[g.id][L]=Math.max(starsOf(g.id,L),stars); prog.best[g.id]=prog.best[g.id]||{}; prog.best[g.id][L]=Math.max(bestOf(g.id,L),pct); save();
      celebrate(); setTimeout(sWin,350); setTimeout(()=>speak(`${praise()} Bạn ${NAME} đã qua cấp ${L}.`,true,'praise'),900);
      box.innerHTML=`<h2>${praise()}</h2><div class="st">${ico('⭐').repeat(stars)}</div><div class="stamp">✓ HOÀN THÀNH CẤP ${L} · ${ico(TH(L).icon)} ${TH(L).name}</div><p>${detail}.${L<10?` Đã mở khóa cấp ${L+1}.`:` Đã hoàn thành cả 10 cấp môn ${g.name}!`}</p>`;
      if(L<10){ const nx=el('button','btn go',`Cấp ${L+1} →`); nx.onclick=()=>play(gi,L+1); acts.append(nx); }
      else if(gi<GAMES.length-1){ const nx=el('button','btn go',`Môn ${gi+2}: ${GAMES[gi+1].name} →`); nx.onclick=()=>levels(gi+1); acts.append(nx); }
      else { const hm=el('button','btn go','Về nhà'); hm.onclick=home; acts.append(hm); }
    } else {
      sFail();
      speak(`${retry()} ${NAME} đạt ${pct} phần trăm. Cần đạt từ 90 phần trăm số lượt để qua cấp.`,true);
      if(!starsOf(g.id,L)){ prog.best[g.id]=prog.best[g.id]||{}; prog.best[g.id][L]=Math.max(bestOf(g.id,L),pct); save(); }
      box.innerHTML=`<h2>${retry()}</h2><div class="meter2"><i style="width:${pct}%"></i><b></b></div><p>${detail}. Cần đạt từ 90% số lượt trở lên mới hoàn thành cấp ${L}${L<10&&!starsOf(g.id,L)?`; cấp ${L+1} vẫn khóa`:''}.${starsOf(g.id,L)?` (Cấp ${L} vẫn giữ kết quả hoàn thành trước đó.)`:''}</p>`;
    }
    box.append(acts); w.append(box); stage.append(w);
    (pass?acts.lastChild:again).focus();
    if(pass){  // qua cấp: đợi 10 giây, không chọn gì thì tự sang cấp tiếp
      const nx=acts.lastChild, base=nx.innerHTML, WAIT=10;
      const bar=el('div','autobar','<i></i>'), note=el('div','autonote');
      box.append(bar,note);
      const t0=performance.now(); let lastSec=-1, raf;
      const step=t=>{
        const left=Math.max(0,WAIT-(t-t0)/1000), sec=Math.ceil(left);
        bar.firstChild.style.width=(left/WAIT*100)+'%';
        if(sec!==lastSec){ lastSec=sec; nx.innerHTML=`${base} (${sec})`; note.textContent=`Tự chuyển tiếp sau ${sec} giây nếu không chọn`; }
        if(left<=0){ nx.click(); return; }
        raf=requestAnimationFrame(step);
      };
      raf=requestAnimationFrame(step);
      cleanup.push(()=>cancelAnimationFrame(raf));
    }
  }
  api.theme=TH(L);
  api.nextPic=bag(TH(L).pics);
  const plain = g.id==='type'||g.id==='arrow'||g.id==='memory'||g.id==='sudoku';
  stage.style.background = plain ? TH(L).soft : TH(L).bg;
  revealTheme(stage, TH(L), ()=>{
    RUN[g.id](api);
    sStart();
    later(()=>speak(say.textContent,true),400);
  });
  try{ window.focus(); }catch(e){}
}

/* ================= 16 chủ đề hình ảnh =================
   Mỗi lần vào một cấp, game bốc thăm ngẫu nhiên một chủ đề (tránh lặp lại 6 chủ đề gần nhất),
   rồi trong chủ đề đó hình xuất hiện ngẫu nhiên, hiệu ứng xuất hiện ngẫu nhiên, thỉnh thoảng có "hình may mắn". */

let EMO={};
function ico(ch){ const u=EMO[ch]; return u?`<img class="emo" src="${u}" alt="${ch}" draggable="false">`:`<span class="emt">${ch}</span>`; }

const THEME_MUSIC={'Khủng long':'arrow','Rừng xanh':'arrow','Siêu anh hùng':'click','Thể thao':'click','Đại dương':'hover','Bắc Cực':'hover',
  'Robot':'tech','Vũ trụ':'tech','Nông trại':'drag','Trái cây':'drag','Côn trùng':'type','Cổ tích':'type','Xe cộ':'road','Kẹo bánh':'sweet','Âm nhạc':'sweet','Đồ chơi':'sweet'};
let CUR_THEME=THEMES[0];
const TH=()=>CUR_THEME;
let recentMem=null;
function pickTheme(){
  let recent=recentMem;
  if(!recent){ recent=[]; try{ recent=JSON.parse(localStorage.getItem('btmt-recent')||'[]') }catch(e){} }
  const pool=THEMES.filter(t=>!recent.includes(t.name));
  const t=pick(pool.length?pool:THEMES);
  recent=[t.name,...recent].slice(0,6); recentMem=recent; try{ localStorage.setItem('btmt-recent',JSON.stringify(recent)) }catch(e){}
  return t;
}

/* Màn bốc thăm chủ đề: các biểu tượng quay nhanh như máy xổ số rồi dừng ở chủ đề được chọn */
function revealTheme(stage, theme, done){
  const ov=el('div','reveal'), card=el('div','rcard'), ic=el('div','ric'), nm=el('div','rnm','Chủ đề bất ngờ...');
  card.append(ic,nm); ov.append(card); stage.append(ov);
  let k=0; const order=shuffle(THEMES);
  const spin=setInterval(()=>{ ic.innerHTML=ico(order[k++%order.length].icon); tone(700+(k%4)*110,.03,'square',0,.04); },70);
  cleanup.push(()=>clearInterval(spin));
  later(()=>{ clearInterval(spin); ic.innerHTML=ico(theme.icon); ic.classList.add('land'); nm.textContent=`Chủ đề: ${theme.name}!`;
    sFlower(); speak(`Chủ đề ${theme.name}`,true); },950);
  later(()=>{ ov.classList.add('out'); },1750);
  later(()=>{ ov.remove(); done(); },2050);
}



const CFG={
  sudoku:L=>{ const blanks=S_BLANK[L-1], n=L<=4?4:L<=7?6:9, br=n===4?2:n===6?2:3, bc=n===4?2:3;
    return {need:blanks, blanks, n, br, bc, digits:n===9, total:blanks*S_SEC[L-1], w3:Math.ceil(blanks/4), w2:Math.ceil(blanks/2),
      say: n===9 ? 'Mỗi hàng, mỗi cột và mỗi ô 3×3 có đủ số 1 đến 9, không số nào lặp lại. Chọn ô trống rồi bấm số đúng!'
                 : `Mỗi hàng, mỗi cột và mỗi ô lớn có đủ ${n} hình, không hình nào lặp lại. Chọn ô trống rồi bấm hình đúng!`}; },
  memory:L=>{ const pairs=M_PAIRS[L-1];
    return {need:pairs, pairs, total:pairs*M_SEC[L-1], preview:[3,3,2.5,2,2,1.5,1,1,0,0][L-1], back:[1100,1000,900,850,800,750,700,650,600,550][L-1],
      w3:pairs, w2:pairs*2,   // lật thẻ luôn cần thử: 3 sao khi số lần sai ≤ số cặp
      say:`Lật 2 thẻ tìm hình giống nhau. Tìm hết ${pairs} cặp trước khi hết giờ nhé!`}; },
  hover:L=>({need:10, time:T_HOVER[L-1], size:110-6*(L-1), speed:L<=3?0:(L-3)*0.45,
    say:L<=3?`Bé di chuột chạm vào ${TH(L).who} trước khi hết giờ nhé!`:`${TH(L).who[0].toUpperCase()+TH(L).who.slice(1)} đang chạy, bé đuổi theo chạm vào nhé!`}),
  click:L=>{
    const c = L>=6 ? pick(BCOL) : null;
    return {need:10, time:T_CLICK[L-1], speed:0.4+0.09*(L-1), max:[2,2,3,3,3,4,4,4,5,5][L-1], scale:1.2-0.06*(L-1), every:C_EVERY[L-1], color:c,
      say: c?`Chỉ bấm bóng màu ${c[2].toUpperCase()}, đừng để bóng ${c[2]} bay mất nhé!`:'Bấm nổ bóng trước khi bóng bay mất nhé!'};
  },
  drag:L=>{
    const T=[null,{n:3,bw:.36},{n:4,bw:.34},{n:5,bw:.32},{n:6,bw:.27},{n:4,sort:1,bw:.3},{n:6,sort:1,bw:.28},{n:8,sort:1,bw:.27},{n:6,sort:1,bw:.26,move:.7},{n:8,sort:1,bw:.25,move:1.1},{n:8,sort:1,bw:.21,move:1.5}][L];
    return Object.assign({need:T.n, time:T_DRAG[L-1], say:T.sort?`${TH(L).drag.a.label} vào hộp ĐỎ, ${TH(L).drag.b.label.toLowerCase()} vào hộp XANH nhé!`:`Kéo ${TH(L).who} vào ${TH(L).drag.label.toLowerCase()} trước khi hết giờ!`},T);
  },
  type:L=>{
    const base={need:10, hintAfter:L===1?0:L<=5?1:L<=8?2:3, time:T_TYPE[L-1], perChar:T_WORD[L-1]};
    if(L<=6){
      const sets=[null,['A','S','D','G','H'],['K','L'],['E','R','T'],['Y','U','I','O','P','Q'],['X','C','V','B','N','M'],LETTERS_VN];
      const old=[]; for(let k=1;k<L&&k<6;k++) old.push(...sets[k]);
      return Object.assign(base,{mode:'letter',neu:sets[L],old:L===6?[]:old,say:'Bé tìm chữ này trên bàn phím và bấm trước khi hết giờ!'});
    }
    if(L===7) return Object.assign(base,{mode:'digit',neu:'1234567890'.split(''),old:[],say:'Bé tìm số này ở hàng phím trên cùng nhé!'});
    if(L===8) return Object.assign(base,{mode:'lower',neu:LETTERS_VN,old:[],say:'Đây là chữ thường. Bé tìm phím có chữ này nhé!'});

    return Object.assign(base,{mode:'word',words:WORDS10,need:8,say:'Gõ từng chữ, gặp khoảng trắng thì bấm phím cách dài nhé!'});
  },
  arrow:L=>{
    const T=[null,[5,3,0,1],[5,3,0,1],[6,4,0,1],[6,4,2,1],[7,5,4,1],[7,5,4,2],[8,5,6,2],[8,5,8,3],[8,6,8,3],[8,6,12,3]][L];
    return {need:3, step:T_STEP[L-1], cols:T[0], rows:T[1], rocks:T[2], flowers:T[3], straight:L===1,
      say: (th=>T[3]>1?`Dẫn ${th.hero[1]} lấy hết ${T[3]} ${th.goal[1]}, tránh ${th.block[1]} nhé!`: T[2]?`Dẫn ${th.hero[1]} đến ${th.goal[1]}, tránh ${th.block[1]} nhé!`:`Bấm phím mũi tên dẫn ${th.hero[1]} đến ${th.goal[1]} nhé!`)(TH(L))};
  }
};

/* ================= Chọn điểm xuất hiện =================
   Lấy nhiều điểm ngẫu nhiên, đo khoảng cách tới con trỏ chuột và tới vị trí vật trước.
   Giữ các điểm nằm trong "dải khoảng cách tốt" (không quá gần, không luôn ở góc đối diện),
   rồi chọn ngẫu nhiên một điểm trong đó để bé luôn phải di chuột một đoạn đáng kể. */
function spawnPoint(box, avoid, band, tries=48){
  const {x0,x1,y0,y1}=box, diag=Math.hypot(x1-x0,y1-y0)||1;
  const minD=band[0]*diag, maxD=band[1]*diag;
  let good=[], best=null, bestS=-1;
  for(let i=0;i<tries;i++){
    const x=x0+Math.random()*(x1-x0), y=y0+Math.random()*(y1-y0);
    let d=Infinity;
    avoid.forEach(a=>{ if(a&&isFinite(a.x)) d=Math.min(d, Math.hypot(x-a.x,y-a.y)/(a.w||1)); });
    if(d===Infinity) d=(minD+maxD)/2;
    if(d>=minD && d<=maxD) good.push({x,y});
    if(d>bestS){ bestS=d; best={x,y}; }
  }
  return good.length ? good[Math.floor(Math.random()*good.length)] : best;
}
/* Vị trí con trỏ trên sân chơi, cập nhật liên tục cho mọi môn */
function pointerOn(stage){
  const p={x:NaN,y:NaN};
  on(document,'pointermove',e=>{ const r=stage.getBoundingClientRect(); p.x=e.clientX-r.left; p.y=e.clientY-r.top; },{passive:true});
  on(document,'pointerdown',e=>{ const r=stage.getBoundingClientRect(); p.x=e.clientX-r.left; p.y=e.clientY-r.top; },{passive:true});
  return p;
}

/* ================= Môn 1: Rê chuột ================= */
const RUN={};
function trackPointer(stage){
  const p={x:NaN,y:NaN,active:false};
  const upd=e=>{ const r=stage.getBoundingClientRect(); p.x=e.clientX-r.left; p.y=e.clientY-r.top; p.active = e.pointerType==='mouse' || e.buttons>0 || e.type==='pointerdown'; };
  on(stage,'pointermove',upd); on(stage,'pointerdown',upd);
  on(stage,'pointerup',e=>{ if(e.pointerType!=='mouse') p.active=false; });
  on(stage,'pointerleave',()=>{ p.active=false; });
  return p;
}
RUN.hover=function(api){
  const {stage,cfg}=api;
  const fx=createFX(stage);
  const ptr=trackPointer(stage);
  const pics=shuffle(api.theme.pics);
  let t=null, n=0, lastX=NaN, lastY=NaN;
  function place(){
    if(api.ended) return;
    const r=stage.getBoundingClientRect();
    const size=Math.min(cfg.size, r.width/4);
    const m=size*0.95, box={x0:m,x1:r.width-m,y0:m,y1:r.height*0.68};
    const px=isFinite(ptr.x)?ptr.x:r.width/2, py=isFinite(ptr.y)?ptr.y:r.height/2;
    const band=[0.32+0.015*api.L, 0.62+0.025*api.L];          // cấp càng cao, điểm mới càng xa
    const {x,y}=spawnPoint(box,[{x:px,y:py,w:1},{x:lastX,y:lastY,w:0.85}],band);
    lastX=x; lastY=y;
    // sao chạy thì hướng chạy ra xa con trỏ, không lao vào chuột
    const away=Math.atan2(y-py,x-px), a=away+rnd(-1.1,1.1);
    t={x,y,size,born:performance.now(),vx:Math.cos(a)*cfg.speed,vy:Math.sin(a)*cfg.speed,
       lucky:Math.random()<LUCKY, el:el('div','obj star '+enterCls(),ico(api.nextPic())), ring:el('div','ring')};
    if(t.lucky) t.el.classList.add('lucky');
    t.el.style.left=t.el.style.top='0px'; t.el.style.fontSize=size+'px'; t.ring.style.width=t.ring.style.height=(size*1.6)+'px';
    const bar=makeBar('under'); t.el.append(bar);
    stage.append(t.ring,t.el); pos(); sAppear();
    const me=t;
    t.stop=countdown(cfg.time,bar,()=>{ if(t!==me) return; t=null; me.el.classList.add('fade'); me.ring.remove(); setTimeout(()=>me.el.remove(),300); n++; api.timeout(); later(place,cfg.gap); });
  }
  function pos(){ t.el.style.transform=`translate3d(${t.x}px,${t.y}px,0) translate(-50%,-50%)`; t.ring.style.left=t.x+'px'; t.ring.style.top=t.y+'px'; }
  let raf,last=performance.now();
  function loop(now){
    const dt=Math.min(40,now-last)/16.67; last=now;
    if(t && !api.ended){
      const r=stage.getBoundingClientRect(), m=t.size*0.55;
      t.x+=t.vx*dt; t.y+=t.vy*dt;
      if(t.x<m||t.x>r.width-m){ t.vx*=-1; t.x=Math.max(m,Math.min(r.width-m,t.x)); }
      if(t.y<m||t.y>r.height*0.7){ t.vy*=-1; t.y=Math.max(m,Math.min(r.height*0.7,t.y)); }
      pos();
      if(ptr.active && now-t.born>150 && Math.hypot(ptr.x-t.x,ptr.y-t.y) < t.size*0.62){
        const d=t; t=null; d.stop(); if(d.lucky) luckyHit(fx,d.x,d.y); d.el.classList.add('pop'); d.ring.remove(); sGood(); n++;
        burstSparkle(fx,d.x,d.y); api.good(); setTimeout(()=>d.el.remove(),450);
        later(place,cfg.gap);
      }
    }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop); cleanup.push(()=>cancelAnimationFrame(raf));
  place();
};

/* ================= Môn 2: Nhấp chuột =================
   Mỗi quả bóng đúng là một lượt; bóng bay lọt khỏi màn hình = hết giờ. */
RUN.click=function(api){
  const {stage,cfg}=api;
  const fx=createFX(stage);
  const list=[];
  const nextCol=bag(BCOL);
  let targetsOut=0, lastSpawnX=NaN;
  const ptr=pointerOn(stage);
  function pickX(r, half){
    const avoid=[{x:lastSpawnX,y:0,w:0.9}];
    if(isFinite(ptr.x)) avoid.push({x:ptr.x,y:0,w:1.1});
    list.forEach(o=>{ if(o.y>r.height*0.35) avoid.push({x:o.x,y:0,w:1}); });
    const p=spawnPoint({x0:half,x1:r.width-half,y0:0,y1:0},avoid,[0.28,1]);
    lastSpawnX=p.x; return p.x;
  }
  if(cfg.color){
    const chip=el('div','chip',`Chỉ bấm màu: <b style="background:${cfg.color[0]}"></b> ${cfg.color[2]}`); stage.append(chip);
  }
  function spawn(){
    if(list.length>=cfg.max || api.ended) return;
    const r=stage.getBoundingClientRect();
    let b,o;
    const isBubble = !cfg.color ? Math.random()<0.4 : Math.random()<0.2;
    if(isBubble){
      const sz=rnd(70,100)*cfg.scale;
      b=el('div','obj bubbleo',`<span class="bemo" style="font-size:${Math.round(sz*0.5)}px">${ico(api.nextPic())}</span>`); b.style.width=b.style.height=sz+'px';
      o={el:b,kind:'bubble',sz,x:pickX(r,sz),y:r.height+sz,y0:r.height+sz,w:rnd(0,6),amp:22,target:!cfg.color};
    } else {
      const c = cfg.color && Math.random()<0.5 ? cfg.color : nextCol();
      b=el('div','obj balloon',balloonSVG(c[0],c[1],cfg.scale)+`<span class="bemo onb" style="font-size:${Math.round(36*cfg.scale)}px;top:${Math.round(26*cfg.scale)}px">${ico(api.nextPic())}</span>`);
      o={el:b,kind:'balloon',color:c[0],x:pickX(r,50),y:r.height+10,y0:r.height+10,w:rnd(0,6),amp:14,target:!cfg.color||c===cfg.color};
    }
    // không thả thêm mục tiêu khi đã đủ số lượt
    if(o.target && api.turns+targetsOut>=cfg.need) return;
    if(o.target) targetsOut++;
    // mỗi quả có đúng thời gian của cấp: bay từ đáy lên hết màn hình trong cfg.time giây
    o.age=0; o.life=cfg.time*(o.target?1:rnd(0.9,1.1)); o.D=o.y0+170;
    if(o.target){ o.bar=makeBar('bal'); o.bar.style.top = o.kind==='balloon' ? Math.round(92*cfg.scale)+'px' : 'calc(100% + 4px)'; b.append(o.bar); }
    b.style.left='0px'; b.style.top='0px'; place(o);
    on(b,'pointerdown',e=>{
      e.stopPropagation();
      if(o.dead||api.ended) return; o.dead=true;
      const s=stage.getBoundingClientRect(), bb=b.getBoundingClientRect();
      if(!o.target){   // chọn sai hình: không nổ vui, hình rung xám rồi biến mất + tính 1 lần sai
        list.splice(list.indexOf(o),1); b.classList.add('nope'); setTimeout(()=>b.remove(),420); api.bad(); return;
      }
      if(o.kind==='balloon'){ burstBalloon(fx,bb.left-s.left+bb.width/2,bb.top-s.top+bb.width*0.52,o.color); sBalloon(); }
      else { burstBubble(fx,bb.left-s.left+bb.width/2,bb.top-s.top+bb.height/2,o.sz/2); sBubble(); }
      b.remove(); list.splice(list.indexOf(o),1);
      if(o.target){ targetsOut--; if(b.classList.contains('lucky')) luckyHit(fx,bb.left-s.left+bb.width/2,bb.top-s.top+bb.height/2); api.good(); } else api.bad();
    });
    if(o.target && Math.random()<LUCKY) b.classList.add('lucky');
    stage.append(b); list.push(o);
  }
  function place(o){
    const x=o.x+Math.sin(o.w)*o.amp;
    o.el.style.transform = o.kind==='balloon'
      ? `translate3d(${x}px,${o.y}px,0) translateX(-50%) rotate(${Math.cos(o.w)*6}deg)`
      : `translate3d(${x}px,${o.y}px,0) translate(-50%,-50%)`;
  }
  on(stage,'pointerdown',e=>{ if(e.target===stage) api.bad('miss'); });
  let last=performance.now(), raf;
  function loop(t){
    const dt=Math.min(40,t-last)/16; last=t;
    for(let k=list.length-1;k>=0;k--){
      const o=list[k]; o.age+=dt*16/1000; const kk=o.age/o.life;
      o.y=o.y0-o.D*kk; o.w+=0.03*dt;
      place(o);
      if(o.bar){ o.bar.firstChild.style.width=Math.max(0,100*(1-kk))+'%'; o.bar.classList.toggle('warn',kk>0.7); }
      if(kk>=1){ o.el.remove(); list.splice(k,1); if(o.target){ targetsOut--; api.timeout(); } }
    }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop); cleanup.push(()=>cancelAnimationFrame(raf));
  spawn(); every(spawn,cfg.every);
};

/* ================= Môn 3: Kéo thả =================
   Mỗi món xuất hiện lần lượt, có thanh thời gian riêng; hết giờ món đó biến mất. */
RUN.drag=function(api){
  const {stage,cfg}=api;
  const fx=createFX(stage);
  const TD=api.theme.drag;
  const r=stage.getBoundingClientRect(), W=r.width, H=r.height;
  const baskets=[];
  const bw=Math.max(120,Math.min(280,W*cfg.bw*(W<560?1.35:1)));
  function mkBasket(kind,label,y,h){
    const b=el('div','basket '+kind,`<div class="in"></div><div class="lb">${label}</div>`);
    b.style.width=bw+'px'; b.style.height=h+'px'; b.style.top=y+'px';
    const o={el:b,kind,x:W-bw-14,y,dir:-1,inEl:b.querySelector('.in')}; b.style.left=o.x+'px';
    stage.append(b); baskets.push(o); return o;
  }
  if(cfg.sort){ const h=(H-42)/2; mkBasket('fruit',TD.a.label,14,h); mkBasket('veg',TD.b.label,28+h,h); }
  else { const h=Math.min(H*0.5,bw*0.85); mkBasket('home',TD.label,H-h-20,h); }
  let items=[];
  if(cfg.sort){ const f=shuffle(TD.a.items).slice(0,Math.ceil(cfg.n/2)), v=shuffle(TD.b.items).slice(0,Math.floor(cfg.n/2));
    items=shuffle([...f.map(e=>[e,'fruit']),...v.map(e=>[e,'veg'])]); }
  else items=shuffle(api.theme.pics).slice(0,cfg.n).map(e=>[e,'home']);
  const leftW=W-bw-40;
  const sz=Math.min(110, Math.max(80, leftW*0.4));
  function overlap(a,b){
    const A=a.getBoundingClientRect(), B=b.getBoundingClientRect();
    const cx=A.left+A.width/2, cy=A.top+A.height/2;
    return cx>B.left-10 && cx<B.right+10 && cy>B.top-20 && cy<B.bottom+10;
  }
  let idx=0, prevX=NaN, prevY=NaN;
  const dptr=pointerOn(stage);
  function spawnItem(){
    if(api.ended || idx>=items.length) return;
    const [emo,kind]=items[idx++];
    const d=el('div','obj fruit '+enterCls(),ico(emo)); const lucky=Math.random()<LUCKY; if(lucky) d.classList.add('lucky');
    d.style.width=d.style.height=sz+'px'; d.style.fontSize=(sz*0.7)+'px';
    const box={x0:14+sz/2,x1:Math.max(16+sz/2,leftW-sz/2),y0:20+sz/2,y1:Math.max(24+sz/2,H-sz/2-40)};
    const sp=spawnPoint(box,[{x:dptr.x,y:dptr.y,w:1},{x:prevX,y:prevY,w:0.8}],[0.35,1]);
    prevX=sp.x; prevY=sp.y;
    const hx=sp.x-sz/2, hy=sp.y-sz/2;
    d.style.left=hx+'px'; d.style.top=hy+'px';
    const bar=makeBar('under'); d.append(bar);
    let ox=0,oy=0,dragging=false,done=false,pid=null;
    const resolve=()=>{ done=true; stop(); later(spawnItem,cfg.gap); };
    const stop=countdown(cfg.time,bar,()=>{
      if(done) return; done=true;
      if(dragging){ try{d.releasePointerCapture(pid)}catch(e){} dragging=false; }
      baskets.forEach(b=>b.el.classList.remove('hot'));
      d.classList.add('fade'); d.style.pointerEvents='none'; setTimeout(()=>d.remove(),300);
      api.timeout(); later(spawnItem,cfg.gap);
    });
    on(d,'pointerdown',e=>{
      if(api.ended||done) return;
      dragging=true; pid=e.pointerId; d.setPointerCapture(e.pointerId); d.classList.add('drag');
      const b=d.getBoundingClientRect(); ox=e.clientX-b.left; oy=e.clientY-b.top; sPick();
    });
    on(d,'pointermove',e=>{
      if(!dragging) return;
      const s=stage.getBoundingClientRect();
      d.style.left=(e.clientX-s.left-ox)+'px'; d.style.top=(e.clientY-s.top-oy)+'px';
      baskets.forEach(b=>{ const h=overlap(d,b.el); if(h&&!b.el.classList.contains('hot')) sHover(); b.el.classList.toggle('hot',h); });
    });
    const drop=()=>{
      if(!dragging||done) return; dragging=false; d.classList.remove('drag');
      baskets.forEach(b=>b.el.classList.remove('hot'));
      const hit=baskets.find(b=>overlap(d,b.el));
      if(hit && hit.kind===kind){
        const s=stage.getBoundingClientRect(), bb=d.getBoundingClientRect();
        burstSparkle(fx,bb.left-s.left+bb.width/2,bb.top-s.top+bb.height/2);
        d.classList.add('done'); d.style.pointerEvents='none'; setTimeout(()=>d.remove(),350);
        hit.inEl.insertAdjacentHTML('beforeend',ico(emo)); sDropOk(); if(lucky) luckyHit(fx,bb.left-s.left+bb.width/2,bb.top-s.top+bb.height/2); api.good(); resolve();
      } else {
        api.bad(hit?undefined:'miss'); sReturn(); d.style.transition='left .35s, top .35s';
        d.style.left=hx+'px'; d.style.top=hy+'px'; setTimeout(()=>d.style.transition='',400);
      }
    };
    on(d,'pointerup',drop); on(d,'pointercancel',drop);
    stage.append(d); sAppear();
    if(api.L===1 && idx===1){
      const hand=el('div','hand','👆'); hand.style.left=(hx+sz/2)+'px'; hand.style.top=(hy+sz/2)+'px'; stage.append(hand);
      later(()=>{ const b=baskets[0]; hand.style.left=(b.x+bw/2-20)+'px'; hand.style.top=(b.y+20)+'px'; },600);
      later(()=>hand.remove(),2600);
    }
  }
  if(cfg.move){
    const minX=Math.max(leftW*0.55, W*0.45), maxX=W-bw-14;
    let raf,last=performance.now();
    const loop=t=>{ const dt=Math.min(40,t-last)/16.67; last=t;
      baskets.forEach((b,k)=>{ b.x+=b.dir*cfg.move*(k?1.2:1)*dt; if(b.x<minX){b.x=minX;b.dir=1} if(b.x>maxX){b.x=maxX;b.dir=-1} b.el.style.left=b.x+'px'; });
      raf=requestAnimationFrame(loop); };
    raf=requestAnimationFrame(loop); cleanup.push(()=>cancelAnimationFrame(raf));
  }
  later(spawnItem,400);
};

/* ================= Môn 4: Gõ phím ================= */
RUN.type=function(api){
  const {stage,cfg}=api; stage.classList.add('plain');
  const ROWS=['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  const box=el('div','typebox');
  const big=el('div','bigkey');
  const bar=makeBar('wide');
  const cap=el('div','cap');
  const kb=el('div','kb');
  const keys={};
  const active=new Set(cfg.mode==='digit'?cfg.neu: cfg.mode==='word'?LETTERS_VN: [...cfg.neu,...cfg.old]);
  ROWS.forEach((rw,ri)=>{
    if(ri===0 && cfg.mode!=='digit') return;
    const row=el('div','row');
    rw.split('').forEach(ch=>{
      const b=el('button',active.has(ch)?'':'dead',ch); b.tabIndex=-1;
      b.onpointerdown=e=>{e.preventDefault(); press(ch);}; keys[ch]=b; row.append(b);
    });
    kb.append(row);
  });
  if(cfg.mode==='word' && api.L===10){ const row=el('div','row'); const sp=el('button','space','phím cách'); sp.tabIndex=-1; sp.onpointerdown=e=>{e.preventDefault(); press(' ');}; keys[' ']=sp; row.append(sp); kb.append(row); }
  box.append(big,bar,cap,kb); stage.append(box);

  const WORDS=cfg.words?shuffle(cfg.words):null;
  const bagNew=bag(cfg.neu||['A']), bagOld=bag(cfg.old&&cfg.old.length?cfg.old:['A']), nextInk=bag(['#FF5A5F','#8E6CFF','#1FA89B','#FF8A1F','#3D7BFF','#E04F9A']);
  let want='', idx=0, word=null, wrongInRow=0, lastPick='', wi=0, stop=null;
  function clearHint(){ Object.values(keys).forEach(k=>k.classList.remove('hint')); }
  function maybeHint(){ if(wrongInRow>=cfg.hintAfter && keys[want]) keys[want].classList.add('hint'); }
  function startClock(sec){
    stop=countdown(sec,bar,()=>{
      if(!want) return;
      const lost = cfg.mode==='word' ? word[0].length-idx : 1;
      want=''; clearHint(); big.classList.add('gone');
      api.timeout(lost);
      if(!api.ended) later(next,cfg.gap+300);
    });
  }
  function next(){
    if(api.ended) return;
    wrongInRow=0; clearHint(); big.classList.remove('gone','right');
    if(cfg.mode==='word'){
      word=WORDS[wi++%WORDS.length]; idx=0; renderWord(); sAppear(); speak(word[0],true);
      startClock(2+cfg.perChar*word[0].length);
    } else {
      let c; const pool = cfg.old.length && Math.random()<0.3 ? cfg.old : cfg.neu;
      const bg_=pool===cfg.old?bagOld:bagNew; do{ c=bg_() }while(c===lastPick && pool.length>1);
      want=lastPick=c;
      big.textContent = cfg.mode==='lower'? c.toLowerCase() : c;
      big.className='bigkey';
      big.style.color=nextInk();
      cap.innerHTML = ico(api.nextPic())+'&nbsp; '+(cfg.mode==='digit' ? `Số ${c}` : cfg.mode==='lower' ? `Chữ “${c.toLowerCase()}” là phím ${c}` : `Chữ ${c}`);
      speak(cfg.mode==='digit'?'Số '+c:'Chữ '+c.toLowerCase(),true);
      sAppear(); maybeHint(); startClock(cfg.time);
    }
  }
  function renderWord(){
    want=word[0][idx].toUpperCase();
    big.className='bigkey word';
    big.innerHTML=word[0].split('').map((ch,i)=>`<span class="${i<idx?'ok':i===idx?'now':''}${ch===' '?' sp':''}">${ch===' '?'␣':ch}</span>`).join('');
    cap.innerHTML=ico(word[1])+'&nbsp; '+word[0];
    clearHint(); maybeHint();
  }
  function press(ch){
    if(!want||api.ended) return;
    if(ch===want){
      wrongInRow=0;
      if(cfg.mode==='word'){
        idx++; sKey(); tone(700+idx*60,.07,'triangle',0,.12);
        if(idx>=word[0].length){
          want=''; stop&&stop();
          big.innerHTML=word[0].split('').map(ch=>`<span class="ok${ch===' '?' sp':''}">${ch===' '?'␣':ch}</span>`).join('');
          sGood(); api.good(); if(!api.ended) later(next,cfg.gap+200);
        } else { api.hit(); renderWord(); }
      } else {
        want=''; stop&&stop(); sKey(); sGood(); api.good();
        big.classList.add('right');
        if(!api.ended) later(next,cfg.gap);
      }
    } else {
      wrongInRow++; api.bad();
      big.classList.remove('shake'); void big.offsetWidth; big.classList.add('shake');
      maybeHint();
    }
  }
  on(document,'keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
    if(e.key===' '){ e.preventDefault(); if(cfg.mode==='word') press(' '); return; }
    const k=(e.key||'').toUpperCase();
    if(/^[A-Z0-9]$/.test(k)){ e.preventDefault(); press(k); }
  });
  later(next,300);
};

/* ================= Môn 5: Phím mũi tên =================
   Thời gian mỗi vòng = số bước ngắn nhất × giây/bước + 2 giây. */
/* Nhóm các hình trông gần giống nhau → coi là một, để Lật thẻ và Sudoku không dùng 2 hình dễ nhầm */
const LOOKALIKE=[['🐑','🐏'],['🐄','🐂','🐃'],['⭐','🌟','💫'],['🌍','🌎','🌏'],['🌙','🌕','🌗','🌞'],['🐔','🐓'],['🐤','🐣'],['🐷','🐖','🐗'],
  ['🐋','🐳'],['🐯','🐅','🐆'],['🐉','🐲'],['🍎','🍏','🍅'],['🚗','🚙','🚕','🏎️'],['🚓','🚑'],['🚌','🚎'],['🚚','🚛'],['🎵','🎶','🎼'],['🥇','🥈','🥉','🏆'],
  ['👨‍🚀','👩‍🚀','🧑‍🚀'],['🛸','👽'],['⛄','☃️'],['🍦','🍨','🍧'],['🍰','🎂','🧁'],['🍬','🍭'],['🦎','🐊'],['🐟','🐠'],['🦞','🦐','🦀'],['🐙','🦑'],['🍃','🌿'],['🚁','✈️','🛩️'],['🎿','⛷️'],['🔧','🔩'],['🖥️','📱']];
const LOOK_MAP=new Map(); LOOKALIKE.forEach((g,i)=>g.forEach(e=>LOOK_MAP.set(e.replace(/\uFE0F/g,''),'grp'+i)));
function lookKey(e){ const k=e.replace(/[\u{1F3FB}-\u{1F3FF}]/gu,'').replace(/\u200D[\u2640\u2642]\uFE0F?/g,'').replace(/\uFE0F/g,''); return LOOK_MAP.get(k)||k; }
/* ================= Môn 6: Lật thẻ =================
   Úp ngược 8 → 100 thẻ (4 → 50 cặp). Lật 2 thẻ: giống nhau thì giữ mở và tìm cặp khác;
   khác nhau thì kêu cảnh báo, tính 1 lần sai rồi úp lại. Cả cấp có một đồng hồ chung. */
RUN.memory=function(api){
  const {stage,cfg}=api; stage.classList.add('plain','memstage');
  const fx=createFX(stage);
  // lấy hình: ưu tiên chủ đề đang chơi, thiếu thì bổ sung từ chủ đề khác (không trùng)
  // bỏ các hình gần giống nhau (khác màu da / nam-nữ của cùng một nhân vật) để bé không bị nhầm
  const base=lookKey;
  const faces=[], seen=new Set();
  const add=e=>{ const k=base(e); if(faces.length<cfg.pairs && !seen.has(k)){ seen.add(k); faces.push(e); } };
  shuffle(api.theme.pics).forEach(add);
  shuffle(THEMES.filter(t=>t!==api.theme)).forEach(t=>shuffle(t.pics).forEach(add));
  const use=faces.slice(0,cfg.pairs), deck=shuffle([...use,...use]);
  const tbar=makeBar('top'); stage.append(tbar);
  const board=el('div','mboard'); stage.append(board);
  const cards=deck.map((face,i)=>{
    const b=el('button','mcard',`<span class="in"><span class="fc back"></span><span class="fc front">${ico(face)}</span></span>`);
    b.tabIndex=-1; b.setAttribute('aria-label','Thẻ úp');
    const c={el:b,face,open:false,done:false};
    b.onpointerdown=e=>{ e.preventDefault(); e.stopPropagation(); flip(c); };
    board.append(b); return c;
  });
  function layout(){
    const r=board.getBoundingClientRect(), n=cards.length, gap=n>60?4:6; let best={s:0,c:1,rows:n};
    for(let c=2;c<=n;c++){ const rows=Math.ceil(n/c); const s=Math.min((r.width-gap*(c-1))/c,(r.height-gap*(rows-1))/rows); if(s>best.s) best={s,c,rows}; }
    const s=Math.max(26,Math.floor(best.s));
    board.style.gap=gap+'px'; board.style.gridTemplateColumns=`repeat(${best.c},${s}px)`; board.style.gridAutoRows=s+'px'; board.style.fontSize=Math.round(s*0.62)+'px';
  }
  layout();
  let ro; try{ ro=new ResizeObserver(layout); ro.observe(board); cleanup.push(()=>ro.disconnect()); }catch(e){}
  let first=null, lock=true, found=0, stop=null;
  const FLIP=260;
  const sVanish=()=>{ tone(700,.14,'sine',0,.1,'act',1800); noise(.08,5200,.12,{type:'highpass'}); };
  const sFlip=()=>{ noise(.05,2400,.25,{type:'highpass'}); tone(520,.06,'triangle',0,.08,'act',760); };
  function center(c){ const s=stage.getBoundingClientRect(), b=c.el.getBoundingClientRect(); return [b.left-s.left+b.width/2, b.top-s.top+b.height/2]; }
  function flip(c){
    if(lock||c.open||c.done||api.ended) return;
    c.open=true; c.el.classList.add('open'); sFlip();
    if(!first){ first=c; return; }
    const a=first, b=c; first=null; lock=true;
    const match=a.face===b.face; if(match) a.done=b.done=true;
    // chờ thẻ thứ 2 lật xong (FLIP ms) rồi mới phát tiếng + hiệu ứng: bé nhìn thấy hình đúng lúc nghe tiếng
    later(()=>{
      if(match){
        a.el.classList.add('done'); b.el.classList.add('done');
        sGood(); burstSparkle(fx,...center(a)); burstSparkle(fx,...center(b));
        found++; api.good(); lock=false;
        later(()=>{ sVanish(); a.el.classList.add('gone'); b.el.classList.add('gone'); },420);   // cặp đúng biến mất, giữ chỗ trống
      } else {
        api.bad();                              // lật sai: âm cảnh báo + tính 1 lần sai, cùng lúc thẻ rung đỏ
        a.el.classList.add('wrong'); b.el.classList.add('wrong');
        later(()=>{ [a,b].forEach(x=>{ x.open=false; x.el.classList.remove('open','wrong'); }); sFlip(); lock=false; }, cfg.back);
      }
    }, FLIP);
  }
  // xem trước: mở hết thẻ vài giây cho bé ghi nhớ (các cấp đầu)
  function begin(){ lock=false; stop=countdown(cfg.total,tbar,()=>{ lock=true;
      cards.forEach(c=>{ if(!c.done){ c.el.classList.add('open','missed'); } });
      for(let k=found;k<cfg.pairs;k++) api.timeout(); }); }
  if(cfg.preview>0){
    later(()=>cards.forEach(c=>c.el.classList.add('open')),150);
    later(()=>{ cards.forEach(c=>c.el.classList.remove('open')); sFlip(); begin(); },150+cfg.preview*1000);
  } else begin();
};

/* ================= Môn 7: Sudoku =================
   Cấp 1–4: 4×4 (ô 2×2) · cấp 5–7: 6×6 (ô 2×3) dùng hình · cấp 8–10: 9×9 (ô 3×3) dùng số.
   Chọn ô trống → bấm hình/số. Đúng: điền vào + tiếng khen; sai: âm cảnh báo, tính 1 lần sai. */
function sudokuMake(n,br,bc,blanks){
  const g=Array.from({length:n},()=>Array(n).fill(0));
  const ok=(g,r,c,v)=>{ for(let i=0;i<n;i++){ if(g[r][i]===v||g[i][c]===v) return false; }
    const r0=r-r%br, c0=c-c%bc; for(let i=0;i<br;i++) for(let j=0;j<bc;j++) if(g[r0+i][c0+j]===v) return false; return true; };
  const fill=(g,k=0)=>{ if(k===n*n) return true; const r=Math.floor(k/n), c=k%n;
    for(const v of shuffle([...Array(n)].map((_,i)=>i+1))){ if(ok(g,r,c,v)){ g[r][c]=v; if(fill(g,k+1)) return true; g[r][c]=0; } } return false; };
  fill(g);
  const sol=g.map(r=>r.slice()), puz=g.map(r=>r.slice());
  const count=(g,limit=2)=>{ let cnt=0; const rec=()=>{ let best=null;
      for(let r=0;r<n&&cnt<limit;r++) for(let c=0;c<n;c++) if(!g[r][c]){ best=[r,c]; r=n; break; }
      if(!best){ cnt++; return; } const [r,c]=best;
      for(let v=1;v<=n&&cnt<limit;v++) if(ok(g,r,c,v)){ g[r][c]=v; rec(); g[r][c]=0; } };
    rec(); return cnt; };
  let removed=0;
  for(const k of shuffle([...Array(n*n).keys()])){
    if(removed>=blanks) break;
    const r=Math.floor(k/n), c=k%n, keep=puz[r][c]; puz[r][c]=0;
    if(count(puz.map(x=>x.slice()))!==1) puz[r][c]=keep; else removed++;
  }
  return {sol,puz,n,br,bc};
}
RUN.sudoku=function(api){
  const {stage,cfg}=api; stage.classList.add('plain','sudostage');
  const fx=createFX(stage);
  const {sol,puz,n,br,bc}=sudokuMake(cfg.n,cfg.br,cfg.bc,cfg.blanks);
  const blanks=puz.flat().filter(v=>!v).length;
  if(blanks<cfg.need){ for(let k=blanks;k<cfg.need;k++) api.good(); }   // (hiếm) không đục đủ ô duy nhất → tính sẵn
  // ký hiệu: hình theo chủ đề (không trùng dáng) hoặc số có màu
  const base=lookKey;
  const syms=[]; const seen=new Set();
  if(!cfg.digits){ shuffle(api.theme.pics).forEach(e=>{ const k=base(e); if(syms.length<n && !seen.has(k)){ seen.add(k); syms.push(e); } }); }
  const COLS=['#FF5A5F','#FF8A1F','#E0A800','#1FA89B','#3D7BFF','#8E6CFF','#E04F9A','#2E9E4F','#7A5230'];
  const symHTML=v=> cfg.digits ? `<span class="dg" style="color:${COLS[v-1]}">${v}</span>` : ico(syms[v-1]);
  const tbar=makeBar('top'); stage.append(tbar);
  const wrap=el('div','swrap'), board=el('div','sboard'), pal=el('div','spal');
  board.style.gridTemplateColumns=`repeat(${n},1fr)`;
  wrap.append(board,pal); stage.append(wrap);
  const cells=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const d=el('button','scell'+(puz[r][c]?' given':'')); d.tabIndex=-1;
    if((c+1)%bc===0 && c<n-1) d.classList.add('bR'); if((r+1)%br===0 && r<n-1) d.classList.add('bB');
    if(puz[r][c]) d.innerHTML=symHTML(puz[r][c]);
    const cell={r,c,el:d,val:puz[r][c]}; cells.push(cell);
    d.onpointerdown=e=>{ e.preventDefault(); if(!cell.val){ select(cell); sClick(); } };
    board.append(d);
  }
  const pbtn=[];
  for(let v=1;v<=n;v++){ const b=el('button','sp',symHTML(v)); b.tabIndex=-1; b.onpointerdown=e=>{ e.preventDefault(); put(v); }; pal.append(b); pbtn.push(b); }
  let sel=null, stop=null, lock=false;
  function select(cell){
    cells.forEach(x=>x.el.classList.remove('sel','hl'));
    sel=cell; if(!cell) return;
    cells.forEach(x=>{ if(x.r===cell.r||x.c===cell.c||(Math.floor(x.r/br)===Math.floor(cell.r/br)&&Math.floor(x.c/bc)===Math.floor(cell.c/bc))) x.el.classList.add('hl'); });
    cell.el.classList.add('sel');
  }
  function nextEmpty(from){ const i=from?cells.indexOf(from):-1; for(let k=1;k<=cells.length;k++){ const x=cells[(i+k)%cells.length]; if(!x.val) return x; } return null; }
  function center(c){ const s=stage.getBoundingClientRect(), b=c.el.getBoundingClientRect(); return [b.left-s.left+b.width/2,b.top-s.top+b.height/2]; }
  function put(v){
    if(!sel||lock||api.ended) return;
    const cell=sel;
    if(sol[cell.r][cell.c]===v){
      cell.val=v; cell.el.innerHTML=symHTML(v); cell.el.classList.add('good');
      sGood(); burstSparkle(fx,...center(cell)); api.good();
      select(nextEmpty(cell));
    } else {
      api.bad(); cell.el.classList.remove('bad'); void cell.el.offsetWidth; cell.el.classList.add('bad');
      const b=pbtn[v-1]; b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
    }
  }
  function layout(){
    const r=stage.getBoundingClientRect(), wide=r.width>r.height*1.15;
    wrap.classList.toggle('side',wide);
    const availW=r.width-24-(wide?Math.min(140,r.width*.16):0), availH=r.height-60-(wide?0:Math.min(110,r.height*.2));
    const size=Math.max(160,Math.min(availW,availH));
    board.style.width=board.style.height=size+'px'; board.style.fontSize=Math.round(size/n*0.62)+'px';
    pal.style.fontSize=Math.round(Math.min(56,Math.max(26,size/n*0.55)))+'px';
  }
  layout(); let ro; try{ ro=new ResizeObserver(layout); ro.observe(stage); cleanup.push(()=>ro.disconnect()); }catch(e){}
  on(document,'keydown',e=>{
    const k=e.key; if(/^[1-9]$/.test(k) && +k<=n){ e.preventDefault(); put(+k); return; }
    const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
    if(mv && sel){ e.preventDefault(); let r=sel.r, c=sel.c; for(let t=0;t<n;t++){ r=(r+mv[0]+n)%n; c=(c+mv[1]+n)%n; const x=cells[r*n+c]; if(!x.val){ select(x); sClick(); break; } } }
  });
  select(nextEmpty(null));
  stop=countdown(cfg.total,tbar,()=>{ lock=true; const left=cells.filter(x=>!x.val);
    left.forEach(x=>{ x.el.innerHTML=symHTML(sol[x.r][x.c]); x.el.classList.add('missed'); }); left.forEach(()=>api.timeout()); });
};

RUN.arrow=function(api){
  const {stage,cfg}=api; const TT=api.theme; stage.classList.add('plain','arrowstage');
  let C=cfg.cols, R=cfg.rows;
  if(stage.getBoundingClientRect().width<560 && C>6){ [C,R]=[R,C]; }
  const tbar=makeBar('top'); stage.append(tbar);
  const grid=el('div','grid'); grid.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`; grid.style.gridTemplateRows=`repeat(${R},minmax(0,1fr))`;
  const cells=[];
  for(let i=0;i<C*R;i++){ const c=el('div','cell'); cells.push(c); grid.append(c); }
  const pad=el('div','pad'), btn={};
  [['up','↑'],['left','←'],['down','↓'],['right','→']].forEach(([d,s])=>{
    const b=el('button',d,s); b.tabIndex=-1; b.onpointerdown=e=>{e.preventDefault(); move(d);}; btn[d]=b; pad.append(b);
  });
  stage.append(grid,pad);
  let bee=null, flowers=[], rocks=new Set(), stop=null;
  const key=(x,y)=>y*C+x;
  function dist(from){
    const D=new Map([[key(from.x,from.y),0]]), q=[from];
    while(q.length){ const p=q.shift(), d0=D.get(key(p.x,p.y));
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const x=p.x+dx,y=p.y+dy,k=key(x,y);
        if(x>=0&&y>=0&&x<C&&y<R&&!rocks.has(k)&&!D.has(k)){D.set(k,d0+1);q.push({x,y})} }); }
    return D;
  }
  function tourLen(){ // tham lam: luôn đi tới bông hoa gần nhất
    let cur=bee, left=flowers.slice(), total=0;
    while(left.length){ const D=dist(cur); left.sort((a,b)=>(D.get(key(a.x,a.y))??1e9)-(D.get(key(b.x,b.y))??1e9));
      const f=left.shift(), d=D.get(key(f.x,f.y)); if(d==null) return 1e9; total+=d; cur=f; }
    return total;
  }
  function round(){
    if(api.ended) return;
    for(let tries=0;tries<300;tries++){
      rocks=new Set(); flowers=[];
      bee={x:0,y:Math.floor(Math.random()*R)};
      if(cfg.straight){ flowers=[{x:C-1,y:bee.y}]; break; }
      const used=new Set([key(bee.x,bee.y)]);
      const minM=Math.max(3,Math.round((C+R)*0.45)), minF=Math.max(2,Math.round((C+R)*0.25));
      let guard=0;
      while(flowers.length<cfg.flowers && guard++<400){
        const f={x:Math.floor(rnd(1,C)),y:Math.floor(Math.random()*R)}, k=key(f.x,f.y);
        const far = Math.abs(f.x-bee.x)+Math.abs(f.y-bee.y) >= (guard>300?2:minM);
        const apart = flowers.every(o=>Math.abs(o.x-f.x)+Math.abs(o.y-f.y) >= (guard>300?1:minF));
        if(!used.has(k) && far && apart){ used.add(k); flowers.push(f); }
      }
      while(rocks.size<cfg.rocks){ const x=Math.floor(Math.random()*C),y=Math.floor(Math.random()*R),k=key(x,y); if(!used.has(k)){used.add(k);rocks.add(k)} }
      if(tourLen()<1e9) break;
    }
    cells.forEach(c=>c.classList.remove('path'));
    draw(); sAppear();
    stop=countdown(2+tourLen()*cfg.step, tbar, ()=>{
      if(!bee) return;
      const lost=Math.max(1,tourLen()); bee=null;
      grid.classList.add('gone'); api.timeout(lost);
      if(!api.ended) later(()=>{ grid.classList.remove('gone'); round(); },cfg.gap+400);
    });
  }
  function draw(){
    cells.forEach((c,i)=>{ c.innerHTML = rocks.has(i)?ico(TT.block[0]):''; c.classList.toggle('rock',rocks.has(i)); });
    flowers.forEach(f=>cells[key(f.x,f.y)].innerHTML=ico(TT.goal[0]));
    if(bee) cells[key(bee.x,bee.y)].innerHTML=ico(TT.hero[0]);
  }
  function move(d){
    if(api.ended||!bee) return;
    const b0={...bee}, nb={...bee};
    if(d==='up') nb.y--; if(d==='down') nb.y++; if(d==='left') nb.x--; if(d==='right') nb.x++;
    btn[d].classList.add('lit'); setTimeout(()=>btn[d].classList.remove('lit'),150);
    if(nb.x<0||nb.y<0||nb.x>=C||nb.y>=R||rocks.has(key(nb.x,nb.y))){
      const c=cells[key(b0.x,b0.y)]; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      sBump(); api.bad(); return;
    }
    bee=nb; cells[key(b0.x,b0.y)].classList.add('path'); sStep();
    const fi=flowers.findIndex(f=>f.x===bee.x&&f.y===bee.y);
    if(fi>=0){ flowers.splice(fi,1); sFlower(); }
    draw();
    if(flowers.length){ api.hit(); return; }
    stop&&stop();
    cells[key(bee.x,bee.y)].innerHTML=ico(TT.hero[0])+ico(TT.goal[0]); sGood(); api.good(); bee=null;
    if(!api.ended) later(round,cfg.gap+300);
  }
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  on(document,'keydown',e=>{ const d=map[e.key]; if(d){ e.preventDefault(); if(!e.repeat) move(d); } });
  round();
};

login();
})();
</script>
